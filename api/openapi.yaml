openapi: "3.0.3"
info:
  title: Arduino LED Strip — MQTT Control Protocol
  version: "2.0.0"
  description: |
    MQTT-based control protocol for the Arduino Uno R4 WiFi LED strip controller.
    The Arduino connects to a HiveMQ Cloud broker via TLS (port 8883).
    The frontend (Vue SPA) connects via WebSocket Secure (port 8884) to the same broker.

    Credentials are shared: the username/password from `.envrc` are baked into the
    Arduino firmware by `run.sh`; the frontend prompts the user for them and stores
    them in localStorage.

servers:
  - url: mqtts://157f4ec42861480695b95d99a47d8ae4.s1.eu.hivemq.cloud:8883
    description: MQTT broker (TLS) — Arduino connects here
  - url: wss://157f4ec42861480695b95d99a47d8ae4.s1.eu.hivemq.cloud:8884/mqtt
    description: MQTT over WebSocket Secure — frontend connects here

x-topics:
  command:
    topic: arduino/in
    direction: Frontend → Arduino
    description: Commands published by the frontend to control the LED strip.
  state:
    topic: arduino/out
    direction: Arduino → Frontend
    description: State updates published by the Arduino after each command or on request.

x-commands:
  - action: toggle
    description: Toggle the LED strip on/off.
    payload:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [toggle]
      example:
        action: toggle

  - action: on
    description: Turn the LED strip on.
    payload:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [on]
      example:
        action: on

  - action: off
    description: Turn the LED strip off.
    payload:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [off]
      example:
        action: off

  - action: set_scene
    description: Switch to a named scene.
    payload:
      type: object
      required:
        - action
        - scene
      properties:
        action:
          type: string
          enum: [set_scene]
        scene:
          type: string
          enum: [blue-noise, rainbow-chase, single-led, solid-color, rainbow, rainbow-with-glitter, confetti, sinelon, juggle, bpm]
      example:
        action: set_scene
        scene: rainbow-chase

  - action: set_brightness
    description: Set the brightness level (0-255).
    payload:
      type: object
      required:
        - action
        - brightness
      properties:
        action:
          type: string
          enum: [set_brightness]
        brightness:
          type: integer
          minimum: 0
          maximum: 255
      example:
        action: set_brightness
        brightness: 200

  - action: set_color
    description: Set the RGB color for the solid-color scene.
    payload:
      type: object
      required:
        - action
        - r
        - g
        - b
      properties:
        action:
          type: string
          enum: [set_color]
        r:
          type: integer
          minimum: 0
          maximum: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
        b:
          type: integer
          minimum: 0
          maximum: 255
      example:
        action: set_color
        r: 255
        g: 128
        b: 64

  - action: set_pixel
    description: Light a single LED pixel and switch to the single-led scene.
    payload:
      type: object
      required:
        - action
        - index
      properties:
        action:
          type: string
          enum: [set_pixel]
        index:
          type: integer
          minimum: 0
      example:
        action: set_pixel
        index: 42

  - action: get_state
    description: Request the Arduino to publish its full current state.
    payload:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [get_state]
      example:
        action: get_state

x-state-message:
  description: Published by the Arduino to arduino/out after each command, on connect, and on request.
  type: object
  required:
    - on
    - brightness
    - scene
    - r
    - g
    - b
  properties:
    on:
      type: boolean
      description: Whether the LED strip is on
    brightness:
      type: integer
      description: Current brightness level (0-255)
    scene:
      type: string
      description: The name of the currently active scene
    r:
      type: integer
      description: Current red value for the solid-color scene (0-255)
    g:
      type: integer
      description: Current green value for the solid-color scene (0-255)
    b:
      type: integer
      description: Current blue value for the solid-color scene (0-255)
  example:
    on: true
    brightness: 200
    scene: rainbow-chase
    r: 255
    g: 128
    b: 64